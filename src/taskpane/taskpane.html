<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raum-Anforderungen</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="text/javascript" src="taskpane.js"></script>
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>
<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Logo" title="Contoso" />
        <h1 class="ms-font-su">Raumbuchung</h1>
    </header>

    <main id="app-body" class="ms-welcome__main">
        <form id="requirementsForm">
            <!-- Präsentation -->
            <div class="form-group">
                <label for="presentation">Präsentation</label>
                <select id="presentation" required>
                    <option value="">Bitte auswählen...</option>
                    <option value="analog">Analog</option>
                    <option value="digital">Digital</option>
                    <option value="digital">keine</option>
                </select>
            </div>

            <!-- Externe Gäste -->
            <div class="form-group">
                <label for="externalGuests">Externe Gäste?</label>
                <select id="externalGuests" required>
                    <option value="">Bitte auswählen...</option>
                    <option value="yes">Ja</option>
                    <option value="no">Nein</option>
                </select>
            </div>

            <!-- Bedingtes Feld: Gerät (Standardmäßig ausgeblendet) -->
            <div id="guestDeviceContainer" class="form-group" style="display: none;">
                <label for="guestDevice">Gerät der externen Gäste</label>
                <select id="guestDevice">
                    <option value="windows">Windows-Laptop</option>
                    <option value="mac">Mac</option>
                    <option value="mobile">Smartphone/Tablet</option>
                    <option value="unknown">Unbekannt</option>
                </select>
            </div>

            <!-- Videokonferenz -->
            <div class="form-group">
                <label for="meetingType">Videokonferenz</label>
                <select id="meetingType" required>
                    <option value="">Bitte auswählen...</option>
                    <option value="teams">Microsoft Teams</option>
                    <option value="other">Andere Plattform</option>
                    <option value="none">Keine</option>
                </select>
            </div>

            <!-- Bewirtung -->
            <div class="form-group">
                <label>Bewirtung gewünscht?</label>
                <div class="checkbox-inline">
                    <input type="checkbox" id="cateringRequested"> 
                    <span class="checkbox-label">Ja, Bewirtung bestellen</span>
                </div>
            </div>
            
            <!-- Bedingtes Feld: Bewirtungs-Details (Standardmäßig ausgeblendet) -->
            <div id="cateringDetailsContainer" class="form-group" style="display: none; border-left: 3px solid #0078d7; padding-left: 15px; margin-left: 5px;">
                <form id="requirementsForm">
                    <!-- Meeting Details (Automatisch) -->
                    <div class="section-title">Meeting Details</div>
                    <div class="data-grid">
                        <div class="grid-item"><label>Datum</label><span id="auto-date" class="read-only">-</span></div>
                        <div class="grid-item"><label>Zeit</label><span id="auto-time" class="read-only">-</span></div>
                        <div class="grid-item"><label>Raum</label><span id="auto-room" class="read-only">-</span></div>
                        <div class="grid-item"><label>Projekt</label><input type="text" id="project-name"></div>
                        <div class="grid-item"><label>Gastgeber</label><span id="auto-host" class="read-only">-</span></div>
                        <div class="grid-item"><label>Vertreter</label><input type="text" id="representative"></div>
                        <div class="grid-item"><label>Anzahl Gäste</label><input type="number" id="guest-count"></div>
                        <div class="grid-item"><label>Sonstiges</label><input type="text" id="other-info"></div>
                    </div>
            
                    <!-- Externe Gäste Status -->
                    <div class="section-title">Externe Gäste</div>
                    <div class="checkbox-group-row">
                        <label><input type="checkbox" name="guestStatus" value="Gold"> Gold</label>
                        <label><input type="checkbox" name="guestStatus" value="Silber"> Silber</label>
                        <label><input type="checkbox" name="guestStatus" value="Bronze"> Bronze</label>
                        <label><input type="checkbox" name="guestStatus" value="VIP"> VIP</label>
                    </div>
            
                    <!-- Bewirtung -->
                    <div class="section-title">Bewirtung</div>
                    <div class="checkbox-group-row">
                        <label><input type="checkbox" id="cat-fruchtig" name="cateringType" value="fruchtig"> Fruchtig</label>
                        <label><input type="checkbox" id="cat-süß" name="cateringType" value="süß"> Süß</label>
                        <label><input type="checkbox" id="cat-herzhaft" name="cateringType" value="herzhaft"> Herzhaft</label>
                    </div>
            
                    <!-- Tischreservierung Kantine -->
                    <div class="section-title">Tischreservierung Kantine</div>
                    <div class="checkbox-inline">
                        <input type="checkbox" id="canteenRequested"> 
                        <label for="canteenRequested">Einladungskärtchen Kantine (mit Namensnennung)</label>
                    </div>
                    
                    <div id="canteenDetailsContainer" class="data-grid" style="display: none;">
                        <div class="grid-item"><label>Datum</label><input type="date" id="cant-date"></div>
                        <div class="grid-item"><label>Zeit</label><input type="time" id="cant-time"></div>
                        <div class="grid-item"><label>Anzahl Gäste</label><input type="number" id="cant-guests"></div>
                        <div class="grid-item"><label>Allergien</label><input type="text" id="cant-allergies"></div>
                    </div>
                </form>
            </div>

            <div class="ms-welcome__action ms-Button ms-Button--hero ms-Button--primary" id="run">
                <span class="ms-Button-label">Angaben speichern</span>
            </div>
        </form>
    </main>
</body>
</html>
